# Render Blueprint for the backend API (Docker).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Assumes this repo's root contains the `backend/` folder. Set the secret env
# vars (marked sync:false) in the Render dashboard after the first deploy.
services:
  - type: web
    name: ai-doc-extraction-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Persistent disk so uploaded documents survive restarts/deploys.
    disk:
      name: storage
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DIR
        value: /data/storage
      - key: WEB_CONCURRENCY
        value: "2"
