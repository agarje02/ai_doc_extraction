[project]
name = "ai-doc-extraction"
version = "0.1.0"
description = "AI Document Intelligence & Entity Extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "SQLAlchemy>=2.0",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "Pillow>=11",
    "tiktoken>=0.8",
    "typer>=0.15",
]

[project.optional-dependencies]
openai = ["openai>=1.59"]
anthropic = ["anthropic>=0.42"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3"]

[project.scripts]
aidocx = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
